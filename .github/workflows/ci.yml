name: ci

on:
  push:
  pull_request:

jobs:
  automation-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate OpenClaw automation package
        shell: pwsh
        run: ./scripts/setup-automations.ps1 -ValidateOnly -DeliveryTargets @("chat:ci-group-1", "chat:ci-group-2", "chat:ci-group-3")
      - name: Test scheduled multi-group delivery contract
        shell: pwsh
        run: ./tests/automation-delivery-contract.ps1
      - name: Test Linux OpenClaw config normalization
        run: python -m unittest tests/test_normalize_openclaw_config.py

  weather-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/weather-query-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/weather-query-tools/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run plugin:validate
