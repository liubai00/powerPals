services:
  weather-bot:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  weather-scheduler:
    build: .
    command: ["python", "-m", "services.weather_bot.scheduler"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  weather-feishu-ws:
    build: .
    command: ["python", "-m", "services.weather_bot.feishu_ws"]
    environment:
      FEISHU_WS_BOT_ROLE: weather
      FEISHU_INTERNAL_BASE_URL: http://weather-bot:8000
    env_file:
      - path: .env
        required: false
    depends_on:
      - weather-bot
    restart: unless-stopped

  task-feishu-ws:
    build: .
    command: ["python", "-m", "services.weather_bot.feishu_ws"]
    environment:
      FEISHU_WS_BOT_ROLE: task
      FEISHU_INTERNAL_BASE_URL: http://weather-bot:8000
    env_file:
      - path: .env
        required: false
    depends_on:
      - weather-bot
    restart: unless-stopped
