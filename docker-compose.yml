services:
  weather-bot:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  weather-scheduler:
    build: .
    command: ["python", "-m", "services.weather_bot.scheduler"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
